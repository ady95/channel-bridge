# =============================================================================
# 브릿지 정의 (개발 환경)
#
# 자격증명은 여기 담지 않는다. 환경변수 *이름*만 참조한다. (NFR-3)
# 실제 값은 dev/.env, dev/.tokens.env 또는 컨테이너 환경변수에서 읽는다.
# =============================================================================

workspaces:
  - id: mm-a
    platform: mattermost
    alias: 본사MM
    base_url: http://192.168.0.136:8071
    token_env: MM_A_BOT_TOKEN

  - id: mm-b
    platform: mattermost
    alias: 파트너MM
    base_url: http://192.168.0.136:8072
    token_env: MM_B_BOT_TOKEN

  - id: slack-dev
    platform: slack
    alias: Slack
    token_env: SLACK_BOT_TOKEN
    app_token_env: SLACK_APP_TOKEN

bridges:
  # Phase 1 목표: MM↔MM 양방향 텍스트·쓰레드 전달
  - id: mm-demo
    name: MM-A/bridge-1 <-> MM-B/bridge-1
    endpoints:
      - workspace: mm-a
        team: bridge
        channel: bridge-1
      - workspace: mm-b
        team: bridge
        channel: bridge-1
    options:
      relay_edits: true
      relay_deletes: true
      relay_files: true
      # Phase 3 에서 활성화
      relay_reactions: false
      relay_bot_messages: false
      allow_channel_mentions: false

  # Phase 2 목표: MM↔Slack 양방향
  # mm-a 의 bridge-2 를 쓴다. 한 채널은 하나의 브릿지에만 속할 수 있다(PRD 5.1).
  #
  # SLACK_BOT_TOKEN / SLACK_APP_TOKEN 이 준비되면 주석을 해제한다.
  # 지금 켜면 기동 시 ConfigError 로 멈춘다.
  # - id: slack-demo
  #   name: MM-A/bridge-2 <-> Slack/#test
  #   endpoints:
  #     - workspace: mm-a
  #       team: bridge
  #       channel: bridge-2
  #     - workspace: slack-dev
  #       channel: test
  #   options:
  #     relay_edits: true
  #     relay_deletes: true
  #     relay_files: false
  #     relay_reactions: false
  #     relay_bot_messages: false
  #     allow_channel_mentions: false
